[theme]
primaryColor = "#1E88E5"
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#262730"
textColor = "#FAFAFA"
font = "sans serif"

[server]
headless = true
enableCORS = false
enableXsrfProtection = true
# 本機開發：儲存 Python／頁面檔後自動重跑 app（需 Streamlit >= 1.29）
runOnSave = true

[browser]
gatherUsageStats = false
